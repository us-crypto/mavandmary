<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maverick & Maryam 💖</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&family=Dancing+Script:wght@700&display=swap');

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ff9ff3, #f368e0, #ffeaa7);
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      position: relative;
    }

    .container {
      max-width: 820px;
      margin: 20px auto;
      background: rgba(255,255,255,0.96);
      border-radius: 40px;
      box-shadow: 0 25px 70px rgba(232,67,147,0.25);
      border: 16px solid #ff6b9d;
      overflow: hidden;
    }

    .content {
      padding: 45px 30px;
      text-align: center;
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    h1 { font-family: 'Dancing Script', cursive; font-size: 3.6rem; color: #e84393; }
    .subtitle { font-size: 1.5rem; color: #34495e; margin: 20px 0; }

    img { max-width: 100%; border-radius: 20px; margin: 20px 0; box-shadow: 0 15px 40px rgba(0,0,0,0.2); }

    button {
      font-size: 1.4rem;
      padding: 16px 45px;
      margin: 10px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
    }

    .yes { background: #ff6b9d; color: white; }
    .yes:hover { transform: scale(1.08); }

    .no {
      position: fixed;
      background: #ff4757;
      color: white;
      padding: 14px 30px;
      border-radius: 50px;
      z-index: 1000;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .option {
      display: block;
      width: 90%;
      max-width: 420px;
      margin: 12px auto;
      background: #fff0f5;
      padding: 18px;
      border-radius: 30px;
      border: 3px solid #ff9ff3;
      font-size: 1.25rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Page 1 -->
    <div class="content" id="page1">
      <img src="your-favorite-pic.jpg" alt="Maverick & Maryam">
      <h1>Maryam 💖</h1>
      <p class="subtitle">Hey my love... After everything, it's always been you.<br>سلام عشقم مریم</p>
      <h1>Maryam, will you marry me?<br>مریم جونم، باهام ازدواج می‌کنی؟</h1>
      <button class="yes" onclick="nextPage(2)">YES!!! 💍 / بله!!!</button>
    </div>

    <!-- Page 2 -->
    <div class="content" id="page2" style="display:none;">
      <h1>She said YES!!! 🥳💖</h1>
      <p class="subtitle">I'm the happiest man alive.</p>
      <img src="your-favorite-pic.jpg" alt="Us">

      <h2>How do you want our wedding?</h2>
      <button class="option" onclick="nextPage(3, 'Beach American Style')">Beach American Style</button>
      <button class="option" onclick="nextPage(3, 'Woods Fairytale')">Woods Fairytale</button>
      <button class="option" onclick="nextPage(3, 'Cozy Garden')">Cozy Garden</button>
      <button class="option" onclick="nextPage(3, 'Luxury Hall')">Luxury Hall</button>
    </div>

    <!-- Add more pages as needed or tell me to expand -->

  </div>

  <button class="no" id="noBtn">No / نه</button>

  <audio id="music" loop>
    <source src="chikar-kardi.mp3" type="audio/mpeg">
  </audio>

  <script>
    const audio = document.getElementById('music');
    const noBtn = document.getElementById('noBtn');

    function playMusic() {
      audio.volume = 0.65;
      audio.play().catch(() => {});
    }

    document.body.addEventListener('click', playMusic, { once: true });

    noBtn.addEventListener('mouseover', () => {
      const x = Math.random() * (window.innerWidth - 180);
      const y = Math.random() * (window.innerHeight - 100);
      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
    });

    function nextPage(page, value = '') {
      playMusic();
      document.querySelectorAll('.content').forEach(c => c.style.display = 'none');
      const next = document.getElementById(`page${page}`);
      if (next) next.style.display = 'block';
    }
  </script>
</body>
</html>
